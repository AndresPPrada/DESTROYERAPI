<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VANT Admin — Private</title><style>
:root{--bg:#080808;--surface:#111;--surface2:#181818;--line:#292929;--text:#f4f3ef;--muted:#8d8d8d;--accent:#c6b79c;--green:#25d366;--danger:#e06b6b}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}body{background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.45}
button,input,select,textarea{font:inherit}button{cursor:pointer}.container{width:min(1180px,calc(100% - 32px));margin:auto}
header{position:sticky;top:0;z-index:50;background:rgba(8,8,8,.88);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.nav{height:74px;display:flex;align-items:center;gap:28px}.logo{font-size:1.35rem;font-weight:900;letter-spacing:.28em}.navlinks{display:flex;gap:22px;margin-left:auto}.navlinks a{color:#bbb;text-decoration:none;font-size:.83rem}.navlinks a:hover{color:#fff}.nav-actions{display:flex;gap:8px}.iconbtn,.btn{border:1px solid var(--line);background:#111;color:#fff;border-radius:999px;padding:10px 15px}.btn.primary{background:#f4f3ef;color:#080808;border-color:#f4f3ef}.btn.gold{background:var(--accent);color:#080808;border-color:var(--accent)}
.hero{min-height:78vh;display:grid;place-items:center;text-align:center;padding:90px 0;background:radial-gradient(circle at 50% 20%,#202020 0,transparent 35%)}
.eyebrow{font-size:.72rem;letter-spacing:.3em;color:var(--accent);text-transform:uppercase}.hero h1{font-size:clamp(4rem,12vw,9.5rem);line-height:.85;letter-spacing:-.07em;margin:20px 0}.hero p{max-width:650px;color:#aaa;margin:0 auto 28px;font-size:1.05rem}.hero .actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.section{padding:90px 0}.sectionhead{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:30px}.section h2{font-size:clamp(2rem,5vw,4rem);letter-spacing:-.04em}.sectionhead p{color:var(--muted);max-width:500px}
.worlds{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}.world{min-height:330px;background:#0c0c0c;padding:30px;display:flex;flex-direction:column;justify-content:space-between}.world:hover{background:#121212}.world .num{color:var(--muted);font-family:monospace}.world h3{font-size:2rem}.world p{color:#999;max-width:300px}.world a{color:var(--accent);text-decoration:none;font-weight:700}
.filters{display:flex;gap:8px;overflow:auto;padding-bottom:10px}.filter{white-space:nowrap}.filter.active{background:var(--accent);color:#080808}
.products{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#101010;border:1px solid var(--line);overflow:hidden}.cardimg{aspect-ratio:1/1;background:linear-gradient(135deg,#191919,#080808);display:grid;place-items:center;color:#666;font-size:2rem}.cardbody{padding:16px}.tag{font-size:.65rem;letter-spacing:.14em;color:var(--accent);text-transform:uppercase}.card h4{margin:7px 0;font-size:1rem}.card p{color:#888;font-size:.82rem;min-height:42px}.price{font-weight:800;margin:12px 0}.old{text-decoration:line-through;color:#666;font-weight:400;margin-left:7px}.card .btn{width:100%}
.quote{border:1px solid var(--line);padding:50px;background:#101010;text-align:center}.quote h2{margin-bottom:10px}.quote p{color:#999}
footer{border-top:1px solid var(--line);padding:40px 0;color:#777}.footergrid{display:flex;justify-content:space-between;gap:20px}.footerlinks{display:flex;gap:18px}.footerlinks a{color:#999;text-decoration:none}
.drawer,.modal{position:fixed;inset:0;z-index:100;display:none}.drawer.show,.modal.show{display:block}.shade{position:absolute;inset:0;background:#000b}.panel{position:absolute;right:0;top:0;bottom:0;width:min(440px,94vw);background:#101010;border-left:1px solid var(--line);padding:24px;overflow:auto}.modal .panel{left:50%;top:50%;right:auto;bottom:auto;transform:translate(-50%,-50%);width:min(650px,94vw);max-height:90vh}
.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.cartline{padding:14px 0;border-bottom:1px solid var(--line)}.cartline small{color:#888}.qty{display:flex;gap:8px;align-items:center}.qty button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:#181818;color:#fff}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin-bottom:12px}.field label{display:block;font-size:.75rem;color:#999;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;background:#080808;border:1px solid var(--line);color:#fff;border-radius:8px;padding:11px}.field.full{grid-column:1/-1}.adminbar{display:none;background:#0d0d0d;border-bottom:1px solid var(--line);padding:10px}.adminbar.show{display:block}.adminbar .container{display:flex;justify-content:space-between;align-items:center}.badge{font-size:.7rem;padding:4px 8px;border:1px solid var(--line);border-radius:999px;color:var(--accent)}
.admin{display:none}.admin.show{display:block}.adminmain{padding:35px 0}.adminnav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.adminnav button.active{background:var(--accent);color:#080808}.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#101010;border:1px solid var(--line);padding:20px}.stat strong{display:block;font-size:1.8rem;margin-top:8px}.tablewrap{overflow:auto;border:1px solid var(--line)}table{width:100%;border-collapse:collapse;min-width:760px}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);font-size:.82rem}th{color:#888;font-weight:500}.status{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%) translateY(20px);background:#f4f3ef;color:#080808;padding:11px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:200}.toast.show{opacity:1;transform:translateX(-50%)}
@media(max-width:850px){.navlinks{display:none}.worlds{grid-template-columns:1fr}.products{grid-template-columns:repeat(2,1fr)}.statgrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.products{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.footergrid{flex-direction:column}.hero{min-height:70vh}}
</style></head><body>
<header><div class="container nav">
<div class="logo">VANT</div><div style="margin-left:auto" class="row"><span class="badge">ADMIN PANEL</span><a class="iconbtn" href="index.html" style="text-decoration:none">VER SITIO</a><button class="iconbtn" onclick="logout()">SALIR</button></div>
</div></header>
<main class="adminmain"><div class="container">
<div class="eyebrow">VANT ADMIN</div><h1 style="font-size:clamp(2.5rem,6vw,5rem);letter-spacing:-.06em;margin:8px 0">Control center.</h1>
<div class="adminnav"><button class="btn active" onclick="adminTab('dashboard',this)">Dashboard</button><button class="btn" onclick="adminTab('products',this)">Productos</button><button class="btn" onclick="adminTab('settings',this)">Configuración</button></div>
<div id="adminContent"></div>
</div></main>
<div id="editor" class="modal"><div class="shade" onclick="closeEditor()"></div><div class="panel"><div class="row between"><h2 id="editorTitle">Producto</h2><button class="iconbtn" onclick="closeEditor()">✕</button></div><div class="formgrid" style="margin-top:20px">
<div class="field"><label>Nombre</label><input id="eName"></div><div class="field"><label>Línea</label><select id="eLine"><option>PARFUMS</option><option>BUSINESS</option><option>LAB</option></select></div>
<div class="field"><label>Precio</label><input id="ePrice" type="number"></div><div class="field"><label>Precio anterior</label><input id="eOld" type="number"></div>
<div class="field"><label>Inventario</label><input id="eStock" type="number"></div><div class="field"><label>Categoría</label><input id="eCat"></div>
<div class="field full"><label>Descripción</label><textarea id="eDesc" rows="4"></textarea></div>
<div class="field full"><label>Imagen URL</label><input id="eImg"></div>
<div class="field"><label>Destacado</label><select id="eFeatured"><option value="1">Sí</option><option value="0">No</option></select></div>
<div class="field"><label>Estado</label><select id="eActive"><option value="1">Activo</option><option value="0">Oculto</option></select></div>
</div><button class="btn primary" style="width:100%;margin-top:8px" onclick="saveProduct()">Guardar</button></div></div>
<div id="toast" class="toast"></div>
<script>
const KEY='vant_products_v1', CART='vant_cart_v1';
const DEFAULT=[
{id:1,line:'PARFUMS',name:'Auren — Signature',price:149900,old:169900,stock:12,cat:'Fragancias',desc:'Fragancia seleccionada de perfil masculino y contemporáneo.',img:'',featured:1,active:1},
{id:2,line:'PARFUMS',name:'VANT Noir',price:119900,old:0,stock:8,cat:'Fragancias',desc:'Una propuesta intensa para la noche.',img:'',featured:1,active:1},
{id:3,line:'PARFUMS',name:'Discovery Set',price:69900,old:0,stock:20,cat:'Sets',desc:'Selección de fragancias para descubrir el universo VANT.',img:'',featured:0,active:1},
{id:4,line:'BUSINESS',name:'VANT Digital Setup',price:0,old:0,stock:0,cat:'Soluciones',desc:'Diseño y estructuración de soluciones digitales empresariales.',img:'',featured:1,active:1},
{id:5,line:'LAB',name:'VANT AI Lab',price:0,old:0,stock:0,cat:'Innovación',desc:'Prototipado y automatización de ideas con tecnología e IA.',img:'',featured:1,active:1}
];
let products=load(KEY,DEFAULT),cart=load(CART,[]),editing=null,activeFilter='ALL',admin=false;
function load(k,d){try{let x=JSON.parse(localStorage.getItem(k));return x||d}catch(e){return d}}
function persist(){localStorage.setItem(KEY,JSON.stringify(products));localStorage.setItem(CART,JSON.stringify(cart))}
function money(n){return n?new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n):'Consultar'}
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}
function renderFilters(){let cats=['ALL',...new Set(products.filter(p=>p.active&&p.line==='PARFUMS').map(p=>p.cat))];document.getElementById('filters').innerHTML=cats.map(c=>`<button class="filter btn ${activeFilter===c?'active':''}" onclick="activeFilter='${c}';renderStore()">${c==='ALL'?'TODOS':c}</button>`).join('')}
function renderStore(){renderFilters();let arr=products.filter(p=>p.active&&p.line==='PARFUMS'&&(activeFilter==='ALL'||p.cat===activeFilter));document.getElementById('productGrid').innerHTML=arr.map(p=>`<article class="card"><div class="cardimg">${p.img?`<img src="${p.img}" style="width:100%;height:100%;object-fit:cover" onerror="this.style.display='none'">`:'V'}</div><div class="cardbody"><span class="tag">${p.cat}</span><h4>${p.name}</h4><p>${p.desc}</p><div class="price">${money(p.price)} ${p.old?`<span class="old">${money(p.old)}</span>`:''}</div><button class="btn primary" onclick="addCart(${p.id})">Agregar</button></div></article>`).join('')||'<p style="color:#888">No hay productos publicados.</p>';document.getElementById('cartCount').textContent=cart.reduce((s,x)=>s+x.qty,0)}
function addCart(id){let p=products.find(x=>x.id===id);let l=cart.find(x=>x.id===id);if(l)l.qty++;else cart.push({id,qty:1});persist();toast(p.name+' agregado')}
function openCart(){renderCart();document.getElementById('cart').classList.add('show')}function closeCart(){document.getElementById('cart').classList.remove('show')}
function renderCart(){let box=document.getElementById('cartLines');if(!cart.length){box.innerHTML='<p style="color:#888;padding:30px 0">Tu pedido está vacío.</p>';document.getElementById('cartTotal').textContent='$ 0';return}let total=0;box.innerHTML=cart.map((l,i)=>{let p=products.find(x=>x.id===l.id);let sub=p.price*l.qty;total+=sub;return `<div class="cartline"><div class="row between"><b>${p.name}</b><span>${money(sub)}</span></div><small>${money(p.price)}</small><div class="qty" style="margin-top:8px"><button onclick="changeQty(${i},-1)">−</button><b>${l.qty}</b><button onclick="changeQty(${i},1)">+</button><button class="btn" style="margin-left:auto;padding:5px 10px" onclick="cart.splice(${i},1);persist();renderCart();renderStore()">Quitar</button></div></div>`}).join('');document.getElementById('cartTotal').textContent=money(total)}
function changeQty(i,d){cart[i].qty+=d;if(cart[i].qty<=0)cart.splice(i,1);persist();renderCart();renderStore()}
function checkout(){if(!cart.length)return toast('Agrega productos primero');document.getElementById('checkout').classList.add('show')}
function closeCheckout(){document.getElementById('checkout').classList.remove('show')}
function whatsapp(msg){window.open('https://wa.me/573000000000?text='+encodeURIComponent(msg),'_blank')}
function whatsappCart(){if(!cart.length)return;let lines=cart.map(l=>{let p=products.find(x=>x.id===l.id);return `${l.qty} x ${p.name} — ${money(p.price*l.qty)}`}).join('\\n');whatsapp('Hola VANT, quiero realizar este pedido:\\n\\n'+lines+'\\n\\nTotal: '+document.getElementById('cartTotal').textContent);closeCart()}
function pay(mode){let n=document.getElementById('cName').value.trim(),ph=document.getElementById('cPhone').value.trim(),ad=document.getElementById('cAddr').value.trim();if(!n||!ph)return toast('Completa nombre y teléfono');if(mode==='whatsapp'){let lines=cart.map(l=>{let p=products.find(x=>x.id===l.id);return `${l.qty} x ${p.name} — ${money(p.price*l.qty)}`}).join('\\n');whatsapp(`Pedido VANT\\nNombre: ${n}\\nTeléfono: ${ph}\\nDirección: ${ad}\\n\\n${lines}\\n\\nTotal: ${document.getElementById('cartTotal').textContent}`);cart=[];persist();closeCheckout();closeCart();toast('Pedido enviado a WhatsApp')}else toast('Conecta aquí tu proveedor de pagos online')}

function adminTab(tab,btn){document.querySelectorAll('.adminnav button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');let c=document.getElementById('adminContent');if(tab==='dashboard'){c.innerHTML=`<div class="statgrid"><div class="stat">Productos<strong>${products.length}</strong></div><div class="stat">Publicados<strong>${products.filter(p=>p.active).length}</strong></div><div class="stat">Stock<strong>${products.filter(p=>p.line==='PARFUMS').reduce((s,p)=>s+p.stock,0)}</strong></div><div class="stat">Líneas<strong>3</strong></div></div><div style="margin-top:30px;border:1px solid var(--line);padding:25px;background:#101010"><h3>VANT Ecosystem</h3><p style="color:#888;margin-top:8px">Panel central para administrar Parfums, Business y Lab.</p></div>`}else if(tab==='products'){c.innerHTML=`<div class="row between"><h2>Catálogo</h2><button class="btn gold" onclick="openEditor()">+ Nuevo</button></div><div class="tablewrap" style="margin-top:18px"><table><thead><tr><th>Producto</th><th>Línea</th><th>Precio</th><th>Stock</th><th>Estado</th><th></th></tr></thead><tbody>${products.map(p=>`<tr><td><b>${p.name}</b><br><small>${p.cat}</small></td><td>${p.line}</td><td>${money(p.price)}</td><td>${p.stock||'—'}</td><td class="status">${p.active?'Activo':'Oculto'}</td><td><button class="btn" onclick="openEditor(${p.id})">Editar</button> <button class="btn" onclick="deleteProduct(${p.id})">Eliminar</button></td></tr>`).join('')}</tbody></table></div>`}else{c.innerHTML=`<div style="max-width:700px"><h2>Configuración</h2><div class="field" style="margin-top:20px"><label>WhatsApp del negocio (formato internacional)</label><input id="waSetting" value="573000000000"></div><div class="field"><label>Proveedor de pagos</label><select><option>Wompi</option><option>Mercado Pago</option><option>Stripe</option><option>PayU</option></select></div><p style="color:#777;font-size:.8rem">En producción, las claves secretas y credenciales deben permanecer en el servidor, nunca en este HTML.</p><button class="btn primary" onclick="toast('Configuración guardada en esta demo')">Guardar</button></div>`}}
function openEditor(id){editing=id||null;let p=id?products.find(x=>x.id===id):{name:'',line:'PARFUMS',price:0,old:0,stock:0,cat:'',desc:'',img:'',featured:0,active:1};document.getElementById('editorTitle').textContent=id?'Editar producto':'Nuevo producto';['Name','Line','Price','Old','Stock','Cat','Desc','Img','Featured','Active'].forEach(k=>{let el=document.getElementById('e'+k);if(el)el.value=k==='Featured'||k==='Active'?(p[k.toLowerCase()]?1:0):p[k.toLowerCase()]??''});document.getElementById('editor').classList.add('show')}
function closeEditor(){document.getElementById('editor').classList.remove('show')}
function saveProduct(){let p={id:editing||Date.now(),name:eName.value,line:eLine.value,price:+ePrice.value||0,old:+eOld.value||0,stock:+eStock.value||0,cat:eCat.value||'General',desc:eDesc.value,img:eImg.value,featured:+eFeatured.value,active:+eActive.value};if(editing)products=products.map(x=>x.id===editing?p:x);else products.push(p);persist();closeEditor();adminTab('products',document.querySelectorAll('.adminnav button')[1]);toast('Producto guardado')}
function deleteProduct(id){if(confirm('¿Eliminar producto?')){products=products.filter(x=>x.id!==id);persist();adminTab('products',document.querySelectorAll('.adminnav button')[1]);renderStore()}}
window.addEventListener('keydown',e=>{if(e.key==='Escape'){closeCart();closeLogin();closeEditor();closeCheckout()}})


function bootAdmin(){
 if(sessionStorage.getItem('vant_admin')!=='1'){
   document.body.innerHTML=`<main style="min-height:100vh;display:grid;place-items:center;padding:20px"><div style="width:min(420px,100%);border:1px solid var(--line);padding:32px;background:#101010"><div class="eyebrow">VANT PRIVATE</div><h1 style="margin:8px 0 22px">Admin access.</h1><div class="field"><label>Usuario</label><input id="loginUser" value="admin"></div><div class="field"><label>Contraseña</label><input id="loginPass" type="password" placeholder="admin123"></div><button class="btn primary" style="width:100%" onclick="adminLogin()">Ingresar</button><a class="btn" style="display:block;text-align:center;text-decoration:none;margin-top:8px" href="index.html">Volver al sitio</a></div></main>`;
 } else { adminTab('dashboard',document.querySelector('.adminnav button')); }
}
function adminLogin(){
 if(document.getElementById('loginUser').value==='admin' && document.getElementById('loginPass').value==='admin123'){
   sessionStorage.setItem('vant_admin','1'); location.reload();
 } else alert('Credenciales incorrectas');
}
function logout(){sessionStorage.removeItem('vant_admin');location.href='index.html'}
bootAdmin();
</script></body></html>
