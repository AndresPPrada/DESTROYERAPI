<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paan Cafe — Carta</title>
<style>
:root{
  --bg:#0c0e13;--card:#191c24;--card-h:#20242e;--border:#272b35;--text:#f5f6f8;--muted:#98a0ac;
  --accent:#f4791e;--accent-soft:rgba(244,121,30,.16);--accent-s:#ff9a44;--accent-d:#d9531a;--on-accent:#2a1206;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  padding-bottom:env(safe-area-inset-bottom,0px);line-height:1.4}
header{position:sticky;top:0;z-index:20;background:rgba(12,14,19,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px}
.row{display:flex;align-items:center;gap:12px;max-width:1100px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.mark{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#2a2013,#100c07 72%);
  border:1.5px solid #d9b06a;display:flex;align-items:center;justify-content:center;font-size:1.1rem}
.brand h1{font-family:Georgia,serif;font-size:1rem;font-weight:700}
.brand .tag{font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-s);font-weight:700}
.btn-cart{position:relative;display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border:1px solid var(--border);
  border-radius:999px;background:var(--card);color:var(--text);font-weight:700;font-size:.8rem;cursor:pointer}
.btn-cart .badge{display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;padding:0 4px;
  border-radius:999px;background:linear-gradient(135deg,var(--accent-s),var(--accent-d));color:var(--on-accent);
  font-size:.66rem;font-weight:800}
nav.cats{display:flex;gap:8px;max-width:1100px;margin:10px auto 0;padding-top:10px;border-top:1px solid var(--border);
  overflow-x:auto;scrollbar-width:none}
nav.cats::-webkit-scrollbar{display:none}
nav.cats a{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;
  border:1px solid var(--border);color:var(--muted);text-decoration:none;font-size:.78rem;font-weight:600;white-space:nowrap}
nav.cats a.active{color:var(--on-accent);background:linear-gradient(135deg,var(--accent-s),var(--accent-d));border-color:transparent}
main{max-width:1100px;margin:0 auto;padding:20px 16px 0}
.cat{padding-top:30px;scroll-margin-top:130px}
.cat+.cat{margin-top:26px;border-top:1px solid var(--border)}
.cat-head{display:flex;align-items:center;gap:10px;margin-bottom:16px;padding:10px 14px;border-left:4px solid var(--accent);
  border-radius:0 12px 12px 0;background:linear-gradient(90deg,var(--accent-soft),transparent)}
.cat-head .ic{font-size:1.3rem}
.cat-head h2{font-size:1.05rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-s)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:920px){.grid{grid-template-columns:repeat(4,1fr)}}
.item{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.item .foto{width:100%;aspect-ratio:3/2;display:flex;align-items:center;justify-content:center;font-size:2.1rem;
  background:linear-gradient(135deg,#171a20,var(--border))}
.item-info{padding:9px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.item-info .nombre{font-weight:700;font-size:.88rem}
.item-info .desc{color:var(--muted);font-size:.74rem;font-style:italic;line-height:1.25}
.pq{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:6px}
.precio{color:var(--accent-s);font-weight:700;font-size:.85rem;background:var(--accent-soft);border-radius:999px;padding:3px 12px}
.stepper{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:999px;padding:3px 6px}
.qbtn{width:20px;height:20px;border-radius:999px;border:none;background:#12151c;color:var(--text);font-size:.95rem;cursor:pointer}
.qval{min-width:14px;text-align:center;font-size:.82rem;font-weight:700}
.btn-add{width:100%;margin-top:8px;border:none;border-radius:999px;padding:8px;background:linear-gradient(135deg,var(--accent-s),var(--accent-d));
  color:var(--on-accent);font-weight:700;font-size:.78rem;cursor:pointer}
footer{text-align:center;color:var(--muted);font-size:.74rem;padding:40px 16px 24px}
.overlay{position:fixed;inset:0;z-index:80;background:rgba(6,7,10,.55);opacity:0;transition:opacity .25s;pointer-events:none}
.overlay.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:85;width:min(88vw,380px);background:#12151c;border-left:1px solid var(--border);
  transform:translateX(100%);transition:transform .3s cubic-bezier(.22,1,.36,1);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.open{transform:translateX(0)}
.d-head{display:flex;align-items:center;justify-content:space-between;padding:18px}
.d-head h3{font-size:.85rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-s)}
.close{width:30px;height:30px;border-radius:50%;border:1px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer}
.d-body{flex:1;overflow-y:auto;padding:0 18px 18px}
.empty{color:var(--muted);font-size:.84rem;text-align:center;padding:40px 4px}
.line{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:.82rem}
.line-name{flex:1}
.line .stepper{padding:2px 5px}
.remove{border:none;background:none;color:var(--muted);font-size:.72rem;text-decoration:underline;cursor:pointer}
.total-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;font-weight:700}
.total-row strong{color:var(--accent-s);font-size:1.05rem}
.send{display:block;width:100%;border:none;border-radius:999px;padding:12px;background:linear-gradient(135deg,#25d366,#128c4a);
  color:#06210f;font-weight:700;cursor:pointer}
.send:disabled{opacity:.5;cursor:default}
.form input{width:100%;margin:4px 0 12px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--card);
  color:var(--text);font-size:.85rem}
.form label{font-size:.74rem;font-weight:700;color:var(--muted)}
.back{display:block;margin:6px auto 0;border:none;background:none;color:var(--muted);font-size:.78rem;text-decoration:underline;cursor:pointer}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translate(-50%,-10px);z-index:90;
  background:var(--card);border:1px solid var(--border);padding:10px 18px;border-radius:10px;font-size:.82rem;opacity:0;
  pointer-events:none;transition:.25s}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<header id="top">
  <div class="row">
    <div class="brand"><span class="mark">☕</span><div><h1>Paan Cafe</h1><div class="tag">Nuestra carta</div></div></div>
    <button class="btn-cart" id="cartBtn">🛒 Su pedido <span class="badge" id="count" hidden>0</span></button>
  </div>
  <nav class="cats" id="catsNav"></nav>
</header>

<main id="main"></main>
<footer>Carta digital de Paan Cafe (réplica de demostración)</footer>

<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer">
  <div class="d-head"><h3>Su pedido</h3><button class="close" id="drawerClose">✕</button></div>
  <div class="d-body">
    <div id="step-items">
      <p class="empty" id="emptyMsg">Su pedido aparecerá aquí. Explore la carta y toque "Agregar".</p>
      <div id="lines"></div>
      <div class="total-row" id="totalRow" hidden><span>Total</span><strong id="totalVal">0</strong></div>
      <button class="send" id="goCheckout" disabled>Continuar por WhatsApp</button>
    </div>
    <div id="step-form" hidden class="form">
      <p style="font-size:.85rem;font-weight:700;margin-bottom:10px">Tus datos</p>
      <label>Nombre<input id="fName" placeholder="Tu nombre"></label>
      <label>Teléfono<input id="fPhone" placeholder="Tu celular" inputmode="tel"></label>
      <label>Dirección / referencia<input id="fAddr" placeholder="Calle, barrio, referencia"></label>
      <p id="fError" style="color:#ff7d7d;font-size:.78rem;margin-bottom:10px" hidden></p>
      <button class="send" id="confirmSend">Enviar pedido por WhatsApp</button>
      <button class="back" id="backBtn">Volver al pedido</button>
    </div>
  </div>
</aside>
<div class="toast" id="toast"></div>

<script>
const WHATSAPP_NUMBER = "573118949859"; // reemplazar por el número real del negocio

const MENU = [
 {id:"cat1",icon:"⭐",name:"MÁS POPULARES",items:[
   {id:11,n:"Capuccino",p:8900},
   {id:28,n:"Desayuno Paan Clásico",d:"Arepa, huevos pericos, queso y café",p:17900},
   {id:50,n:"Caldo de Carne",d:"Arepa con queso y café o chocolate",p:18900},
   {id:10,n:"Latte",p:8500},
   {id:25,n:"Hojaldre de Pollo",p:7900},
   {id:51,n:"Caldo de Huevo",d:"Arepa con queso y café o chocolate",p:18900},
 ]},
 {id:"cat2",icon:"🥤",name:"BEBIDAS CALIENTES",items:[
   {id:9,n:"Americano",p:6500},{id:11,n:"Capuccino",p:8900},
   {id:12,n:"Chocolate Parisino",d:"Chocolate caliente con chantilli",p:10000},
   {id:15,n:"Espresso",d:"Sencillo o doble",p:5500},
   {id:45,n:"French Press Individual",p:11900},
   {id:13,n:"Infusión Frutal",p:6500},{id:10,n:"Latte",p:8500},
   {id:17,n:"Macchiato",p:5900},{id:14,n:"Mocaccino",p:9500},
 ]},
 {id:"cat3",icon:"🥤",name:"BEBIDAS FRÍAS",items:[
   {id:5,n:"Affogato",d:"Helado, espresso, arequipe y maní",p:9900},
   {id:1,n:"Agua de Botella",p:4500},
   {id:6,n:"Cold Matcha",d:"Matcha, leche y hielo",p:12900},
   {id:38,n:"Frappés",d:"Mandarina, naranja o limonada de hierbabuena",p:11900},
   {id:8,n:"Frapuccino de Arequipe o Chocolate",p:16900},
   {id:3,n:"Ice Latte de Vainilla",p:10900},
   {id:43,n:"Iced American Coffee",p:7500},
   {id:39,n:"Sodas",d:"Maracuyá, limón o frutos rojos",p:14500},
   {id:53,n:"Strawberry Matcha",p:14900},
 ]},
 {id:"cat4",icon:"🍲",name:"CALDOS",items:[
   {id:50,n:"Caldo de Carne",d:"Arepa con queso y café o chocolate",p:18900},
   {id:51,n:"Caldo de Huevo",d:"Arepa con queso y café o chocolate",p:18900},
 ]},
 {id:"cat5",icon:"🍽️",name:"PA EMPEZAR EL DÍA",items:[
   {id:29,n:"Calenta'o",d:"Arroz, maduro, frijoles, huevos fritos, arepa y suero costeño",p:19900},
   {id:28,n:"Desayuno Paan Clásico",d:"Arepa, huevos pericos, queso y café",p:17900},
   {id:27,n:"Huevos Benedictinos",d:"2 huevos poché, salsa holandesa, tocineta y pan de masa madre",p:24900},
   {id:26,n:"Omelette Parmesano",d:"Huevo, queso parmesano, tomate cherry y pan de masa madre",p:20900},
   {id:30,n:"Paancakes",d:"Arándanos, banano y fresa, salsa de frutos rojos y miel de maple",p:21900},
   {id:31,n:"Berry French Toast",d:"Pan de arándano, banano, fresas y crema chantillí",p:22900},
 ]},
 {id:"cat6",icon:"🍽️",name:"PA' EL ANTOJO",items:[
   {id:19,n:"Carrot Cake",d:"Torta de zanahoria con nueces y frosting",p:12900},
   {id:23,n:"Mil Hoja de Arequipe",p:13900},
   {id:20,n:"Paraíso Limón",d:"Cheesecake de limón",p:11900},
   {id:22,n:"Quesillo",p:13900},
   {id:37,n:"Red Berry Croissant",d:"Croissant relleno de queso crema y frutos rojos",p:16900},
   {id:21,n:"Swiss Roll",d:"Rollo suizo relleno de arequipe",p:8900},
   {id:36,n:"Tentation Waffle",d:"Waffle con arequipe, fresa y banano",p:16900},
   {id:18,n:"Torta de Chocolate",d:"Con arequipe",p:12900},
 ]},
 {id:"cat7",icon:"🍽️",name:"PA' TARDEAR",items:[
   {id:46,n:"Croissant",p:6900},{id:25,n:"Hojaldre de Pollo",p:7900},
   {id:24,n:"Palitos de Queso",p:7900},
   {id:35,n:"Parfait Griego",d:"Yogur griego, granola, kiwi, banano, papaya y fresa",p:18900},
   {id:33,n:"Sandwich Italiano",d:"Mozzarella, jamón, salami, pepperoni y pesto. Papas margarita",p:22900},
   {id:32,n:"Turkey Sandwich",d:"Pavo, queso amarillo, huevo, tomate, lechuga y mostaza Dijon",p:24900},
   {id:34,n:"Wrap de Pollo",d:"Pollo a la parrilla, lechuga, queso cheddar, tocineta y miel mostaza",p:22900},
 ]},
];
const emojiFor = c => ({cat1:"⭐",cat2:"☕",cat3:"🧊",cat4:"🍲",cat5:"🍳",cat6:"🍰",cat7:"🥪"}[c] || "🍽️");
const fmt = n => "$ " + Math.round(n).toLocaleString("es-CO");

let cart = [];
try{ cart = JSON.parse(localStorage.getItem("paan_cart")||"[]"); }catch(e){ cart = []; }
function saveCart(){ try{ localStorage.setItem("paan_cart", JSON.stringify(cart)); }catch(e){} }

const navEl = document.getElementById("catsNav");
const mainEl = document.getElementById("main");

MENU.forEach((cat,i)=>{
  const a = document.createElement("a");
  a.href = "#"+cat.id; a.dataset.id = cat.id;
  a.className = i===0 ? "active" : "";
  a.innerHTML = cat.icon+" "+cat.name;
  navEl.appendChild(a);

  const sec = document.createElement("section");
  sec.className = "cat"; sec.id = cat.id;
  const head = document.createElement("div");
  head.className = "cat-head";
  head.innerHTML = '<span class="ic">'+cat.icon+'</span><h2>'+cat.name+'</h2>';
  sec.appendChild(head);
  const grid = document.createElement("div"); grid.className = "grid";
  cat.items.forEach(item=>{
    const card = document.createElement("article"); card.className = "item";
    card.innerHTML =
      '<div class="foto">'+emojiFor(cat.id)+'</div>'+
      '<div class="item-info">'+
        '<div class="nombre">'+item.n+'</div>'+
        (item.d ? '<div class="desc">'+item.d+'</div>' : '')+
        '<div class="pq"><span class="precio">'+fmt(item.p)+'</span>'+
          '<div class="stepper"><button class="qbtn" data-m="-1">−</button><span class="qval">1</span><button class="qbtn" data-m="1">+</button></div>'+
        '</div>'+
        '<button class="btn-add">Agregar</button>'+
      '</div>';
    let qty = 1;
    const qval = card.querySelector(".qval");
    card.querySelectorAll(".qbtn").forEach(b=>b.addEventListener("click",()=>{
      qty = Math.max(1, Math.min(50, qty + Number(b.dataset.m)));
      qval.textContent = qty;
    }));
    card.querySelector(".btn-add").addEventListener("click",()=>{
      addToCart(item.id, item.n, item.p, qty);
      qty = 1; qval.textContent = 1;
      showToast(item.n + " agregado");
    });
    grid.appendChild(card);
  });
  sec.appendChild(grid);
  mainEl.appendChild(sec);
});

document.querySelectorAll("nav.cats a").forEach(a=>{
  a.addEventListener("click",e=>{
    e.preventDefault();
    document.querySelectorAll("nav.cats a").forEach(x=>x.classList.remove("active"));
    a.classList.add("active");
    document.getElementById(a.dataset.id).scrollIntoView({behavior:"smooth", block:"start"});
  });
});
const sections = MENU.map(c=>document.getElementById(c.id));
window.addEventListener("scroll",()=>{
  let current = sections[0];
  sections.forEach(s=>{ if(s.getBoundingClientRect().top <= 140) current = s; });
  document.querySelectorAll("nav.cats a").forEach(a=>a.classList.toggle("active", a.dataset.id===current.id));
},{passive:true});

function addToCart(id,name,price,qty){
  const line = cart.find(l=>l.id===id);
  if(line){ line.qty = Math.min(50, line.qty+qty); } else { cart.push({id,name,price,qty}); }
  saveCart(); renderCart();
}
function renderCart(){
  const count = cart.reduce((s,l)=>s+l.qty,0);
  const total = cart.reduce((s,l)=>s+l.qty*l.price,0);
  const countEl = document.getElementById("count");
  countEl.textContent = count; countEl.hidden = count===0;
  document.getElementById("emptyMsg").hidden = cart.length>0;
  document.getElementById("totalRow").hidden = cart.length===0;
  document.getElementById("totalVal").textContent = fmt(total);
  document.getElementById("goCheckout").disabled = cart.length===0;
  const linesEl = document.getElementById("lines");
  linesEl.innerHTML = "";
  cart.forEach((l,idx)=>{
    const div = document.createElement("div"); div.className="line";
    div.innerHTML =
      '<div class="stepper"><button class="qbtn" data-a="-1">−</button><span class="qval">'+l.qty+'</span><button class="qbtn" data-a="1">+</button></div>'+
      '<span class="line-name">'+l.name+'</span>'+
      '<button class="remove">Quitar</button>';
    div.querySelector('[data-a="-1"]').addEventListener("click",()=>{
      l.qty--; if(l.qty<=0) cart.splice(idx,1); saveCart(); renderCart();
    });
    div.querySelector('[data-a="1"]').addEventListener("click",()=>{
      l.qty = Math.min(50,l.qty+1); saveCart(); renderCart();
    });
    div.querySelector(".remove").addEventListener("click",()=>{
      cart.splice(idx,1); saveCart(); renderCart();
    });
    linesEl.appendChild(div);
  });
}
renderCart();

const overlay = document.getElementById("overlay");
const drawer = document.getElementById("drawer");
function openDrawer(){ overlay.classList.add("show"); drawer.classList.add("open"); document.body.style.overflow="hidden"; }
function closeDrawer(){ overlay.classList.remove("show"); drawer.classList.remove("open"); document.body.style.overflow=""; showItemsStep(); }
document.getElementById("cartBtn").addEventListener("click", openDrawer);
document.getElementById("drawerClose").addEventListener("click", closeDrawer);
overlay.addEventListener("click", closeDrawer);

function showItemsStep(){
  document.getElementById("step-items").hidden = false;
  document.getElementById("step-form").hidden = true;
}
document.getElementById("goCheckout").addEventListener("click",()=>{
  if(!cart.length) return;
  document.getElementById("step-items").hidden = true;
  document.getElementById("step-form").hidden = false;
});
document.getElementById("backBtn").addEventListener("click", showItemsStep);

document.getElementById("confirmSend").addEventListener("click",()=>{
  const name = document.getElementById("fName").value.trim();
  const phone = document.getElementById("fPhone").value.trim();
  const addr = document.getElementById("fAddr").value.trim();
  const err = document.getElementById("fError");
  if(name.length<2 || phone.replace(/\D/g,"").length<7 || addr.length<3){
    err.textContent = "Completa nombre, teléfono y dirección para continuar.";
    err.hidden = false;
    return;
  }
  err.hidden = true;
  const total = cart.reduce((s,l)=>s+l.qty*l.price,0);
  const lineas = cart.map(l=>"*"+l.qty+"* - "+l.name+" "+fmt(l.price)).join("\n");
  const msg = "Pedido - Paan Cafe\n\nNombre: "+name+"\nTeléfono: "+phone+"\nDirección: "+addr+
    "\n\n"+lineas+"\n\nTotal: "+fmt(total);
  window.open("https://wa.me/"+WHATSAPP_NUMBER+"?text="+encodeURIComponent(msg), "_blank");
  cart = []; saveCart(); renderCart(); closeDrawer();
  showToast("Pedido enviado por WhatsApp");
});

let toastTimer;
function showToast(text){
  const t = document.getElementById("toast");
  t.textContent = text; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("show"), 2200);
}
</script>
</body>
</html>
